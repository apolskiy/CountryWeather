name: CountryWeather CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      env:
        description: 'Domain to test (none for all)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - countries
          - weather

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Overriding threshold to 5s to stop random CI failures on public APIs
      MAX_RESPONSE_TIME: 5.0
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        id: run_tests
        run: |
          # 1. Create fresh directories
          mkdir -p test_results allure-results
          
          # 2. Build command dynamically
          # We do NOT use '|| true' here because we want the CI job to correctly show as 'Failed' if tests fail.
          # The artifacts will still upload because the 'Upload Artifacts' step uses 'if: always()'.
          CMD="pytest tests/ --alluredir=allure-results --junitxml=test_results/results.xml --html=test_results/report.html --self-contained-html -v"
          
          if [ "${{ github.event.inputs.env }}" != "none" ]; then
            CMD="$CMD --env=${{ github.event.inputs.env }}"
          fi
          
          # 3. Execute
          $CMD

      - name: Generate Allure Report
        if: always() # Run even if tests failed
        run: |
          sudo apt-get update && sudo apt-get install -y default-jdk
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload Artifacts
        if: always() # This ensures reports are uploaded even on test failure
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: |
            test_results/
            allure-report/