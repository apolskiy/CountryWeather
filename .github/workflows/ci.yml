name: CountryWeather CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      env:
        description: 'Domain to test (none for all)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - countries
          - weather

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        env:
          RESTCOUNTRIES_API_KEY: ${{ secrets.RESTCOUNTRIES_API_KEY }}
        run: |
          mkdir -p test_results allure-results
          
          # Base command with your required report plugins
          CMD="pytest tests/ --alluredir=allure-results --junitxml=test_results/results.xml --html=test_results/report.html --self-contained-html -v"
          
          # Add environment flag if specified
          if [ "${{ github.event.inputs.env }}" != "none" ]; then
            CMD="$CMD --env=${{ github.event.inputs.env }}"
          fi
          
          # Execute
          $CMD

      - name: Generate Allure Report
        if: always()
        run: |
          sudo apt-get update && sudo apt-get install -y default-jdk
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: |
            test_results/
            allure-report/