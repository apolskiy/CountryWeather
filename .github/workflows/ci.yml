name: CountryWeather CI Pipeline

# Every run of this workflow spends the REST Countries monthly quota, which is
# capped and shared across all branches. A commit that cannot change the result
# must therefore not trigger one: documentation is the common case, and it used
# to run the full suite against the live API for nothing.
#
# paths-ignore rather than paths, deliberately. An allowlist has to be extended
# every time a directory is added, and the failure mode when someone forgets is
# silent - new code that never runs in CI while the badge stays green. A
# denylist fails the other way: the worst case is a run that was not needed,
# which costs quota once and is visible, rather than coverage that was never
# there.
on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.idea/**'
  pull_request:
    branches: [ "**" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.idea/**'
  workflow_dispatch:
    inputs:
      env:
        description: 'Domain to test (none for all)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - countries
          - weather

# Serialize every run of this workflow account-wide. The REST Countries quota
# and burst limit are shared across all branches, so a constant (branch-agnostic)
# group name is required - a per-branch group would let two branches race the
# same API. cancel-in-progress: false lets the in-flight run finish before the
# next one starts, rather than killing it.
concurrency:
  group: countryweather-ci
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.14.5
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.5'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        env:
          RESTCOUNTRIES_API_KEY: ${{ secrets.RESTCOUNTRIES_API_KEY }}
          ENV_INPUT: ${{ github.event.inputs.env }}
        run: |
          PYTEST_ARGS="-v"

          # The env input exists only for workflow_dispatch (empty on push and
          # pull_request); 'none' is the explicit "run every suite" choice.
          if [ -n "$ENV_INPUT" ] && [ "$ENV_INPUT" != "none" ]; then
            PYTEST_ARGS="$PYTEST_ARGS --env=$ENV_INPUT"
          fi

          # The Makefile owns the pytest invocation and artifact directories,
          # so local runs and CI execute the identical command.
          make test PYTEST_ARGS="$PYTEST_ARGS"

      - name: Generate Allure Report
        if: always()
        run: |
          sudo apt-get update && sudo apt-get install -y default-jdk
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-artifacts
          path: |
            test_results/
            allure-report/