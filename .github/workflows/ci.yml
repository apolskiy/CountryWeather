name: CountryWeather CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      env:
        description: 'Domain to test (none for all)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - countries
          - weather

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          mkdir -p allure-results
          
          # Initialize base command
          CMD="pytest tests/ --alluredir=allure-results -v"
          
          # Conditionally add the flag ONLY if it's not 'none'
          if [ "${{ github.event.inputs.env }}" != "none" ]; then
            CMD="$CMD --env=${{ github.event.inputs.env }}"
          fi
          
          # Execute the command
          $CMD

      - name: Generate Allure Report
        if: always()
        run: |
          sudo apt-get update && sudo apt-get install -y default-jdk
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: allure-report/