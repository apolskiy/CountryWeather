name: CountryWeather CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      env:
        description: 'Domain to test'
        required: true
        default: 'all'
        type: choice
        options: [all, countries, weather]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Ensure your requirements.txt includes: pytest, pytest-html, allure-pytest
          pip install -r requirements.txt

      - name: Run Tests and Generate Report
        env:
          TARGET_ENV: ${{ github.event.inputs.env || 'all' }}
        run: |
          # 1. Clean environment
          rm -rf test_results allure-results allure-report
          mkdir -p test_results allure-results

          # 2. Run your specific test command
          # Added -v for logging visibility
          pytest tests/ --env=$TARGET_ENV --junitxml=test_results/results.xml --html=test_results/report.html --self-contained-html --alluredir=allure-results -v

          # 3. Generate report
          # Ensure allure is installed
          sudo apt-get update && sudo apt-get install -y default-jdk
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          # We upload both the HTML report and the Allure folder
          path: |
            test_results/
            allure-report/