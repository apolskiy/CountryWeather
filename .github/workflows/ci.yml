name: CountryWeather CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      env:
        description: 'Domain to test (none for all)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - countries
          - weather

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        env:
          RESTCOUNTRIES_API_KEY: ${{ secrets.RESTCOUNTRIES_API_KEY }}
          ENV_INPUT: ${{ github.event.inputs.env }}
        run: |
          PYTEST_ARGS="-v"

          # The env input exists only for workflow_dispatch (empty on push and
          # pull_request); 'none' is the explicit "run every suite" choice.
          if [ -n "$ENV_INPUT" ] && [ "$ENV_INPUT" != "none" ]; then
            PYTEST_ARGS="$PYTEST_ARGS --env=$ENV_INPUT"
          fi

          # The Makefile owns the pytest invocation and artifact directories,
          # so local runs and CI execute the identical command.
          make test PYTEST_ARGS="$PYTEST_ARGS"

      - name: Generate Allure Report
        if: always()
        run: |
          sudo apt-get update && sudo apt-get install -y default-jdk
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: |
            test_results/
            allure-report/