countries:
  base_url: "https://api.restcountries.com/countries/v5"
  max_response_time: 5.0
  min_results_count: 1
  # Name of the environment variable holding the v5 Bearer API key. The secret
  # itself is never stored here; ApiClient reads it from the environment.
  auth_env_var: "RESTCOUNTRIES_API_KEY"
  # Maximum page size accepted by the v5 API (the API rejects limits > 100).
  # Used by ApiClient.get_objects when paginating list endpoints.
  page_limit: 100
  # Hard per-attempt network ceiling (seconds). A stalled connection fails this
  # fast instead of hanging indefinitely. Must exceed max_response_time so a
  # slow-but-alive response trips the performance gate rather than the timeout.
  request_timeout: 15.0
  # Transient-error resilience: number of extra attempts on connection/timeout
  # errors and retryable HTTP statuses, with exponential backoff
  # (retry_backoff * 2**attempt seconds), or the server's Retry-After header.
  max_retries: 3
  retry_backoff: 0.5
  # HTTP statuses retried with backoff. 429 covers the API's burst rate limit;
  # 502/503/504 cover transient upstream/gateway hiccups.
  retry_statuses: [429, 502, 503, 504]
  # Proactive client-side pacing (seconds). ApiClient enforces at least this
  # gap between the start of consecutive requests across the whole session, so
  # the per-test suite does not burst past the v5 API's short-window rate limit
  # (the reactive 429 retry above is a fallback for gaps this does not cover).
  min_request_interval: 1.0

weather:
  base_url: "https://api.open-meteo.com/v1"
  max_response_time: 3.0
  min_results_count: 1
  # Open-Meteo requires no authentication and exposes no paginated endpoints.
  auth_env_var: null
  page_limit: null
  request_timeout: 10.0
  max_retries: 3
  retry_backoff: 0.5
  retry_statuses: [429, 502, 503, 504]
  # Open-Meteo imposes no burst limit for this suite's volume, so no pacing is
  # needed; 0.0 disables the client-side throttle.
  min_request_interval: 0.0
